services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sportlink-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sportlink
      RABBITMQ_DEFAULT_PASS: sportlink
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sportlink-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  account-db:
    image: postgres:15
    container_name: sportlink-account-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    networks:
      - sportlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d account_service_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  account-service:
    build:
      context: ./account-management-service
      dockerfile: Dockerfile
    container_name: sportlink-account-service
    restart: unless-stopped
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://account-db:5432/account_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: sportlink
      SPRING_RABBITMQ_PASSWORD: sportlink
    ports:
      - "8081:8081"
    networks:
      - sportlink-network

  moderation-db:
    image: postgres:15
    container_name: sportlink-moderation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: moderation_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5439:5432"
    volumes:
      - moderation-db-data:/var/lib/postgresql/data
    networks:
      - sportlink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moderation_service_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  moderation-service:
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    container_name: sportlink-moderation-service
    restart: unless-stopped
    depends_on:
      moderation-db:
        condition: service_healthy
      account-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://moderation-db:5432/moderation_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      ACCOUNT_MANAGEMENT_BASE_URL: http://account-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: sportlink
      SPRING_RABBITMQ_PASSWORD: sportlink
    ports:
      - "8090:8090"
    networks:
      - sportlink-network

volumes:
  account-db-data:
  moderation-db-data:

networks:
  sportlink-network:
    driver: bridge
