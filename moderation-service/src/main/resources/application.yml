server:
  port: 8090

spring:
  application:
    name: moderation-service

  datasource:
    url: jdbc:postgresql://localhost:5439/moderation_service_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:sportlink}
    password: ${SPRING_RABBITMQ_PASSWORD:sportlink}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

sportlink:
  jwt:
    secret: ${SPORTLINK_JWT_SECRET:change-me-in-production-this-is-only-for-local-dev-256-bits-min}
    issuer: sportlink-account-management

clients:
  account-management:
    base-url: ${ACCOUNT_MANAGEMENT_BASE_URL:http://localhost:8081}
  interaction:
    base-url: ${INTERACTION_BASE_URL:http://localhost:8084}
  activity-management:
    base-url: ${ACTIVITY_MANAGEMENT_BASE_URL:http://localhost:8083}

resilience4j:
  circuitbreaker:
    instances:
      accountManagement:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      accountManagement:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - com.sportlink.moderation.exception.AccountSyncException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - java.io.IOException
  timelimiter:
    instances:
      accountManagement:
        timeoutDuration: 3s
        cancelRunningFuture: true

logging:
  level:
    com.sportlink.moderation: INFO
    io.github.resilience4j: INFO
