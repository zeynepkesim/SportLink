server.port=8080
spring.application.name=api-gateway
spring.cloud.discovery.enabled=true

# Eureka Discovery Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.preferIpAddress=true

################ Discovery Server (Eureka web UI) #####################
# Requests to http://localhost:8080/eureka/web are forwarded to http://localhost:8761/
# SetPath=/ strips the /eureka/web prefix so Eureka receives a request to /
spring.cloud.gateway.routes[0].id=discovery-server
spring.cloud.gateway.routes[0].uri=http://localhost:8761
spring.cloud.gateway.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[0].filters[0]=SetPath=/

################ product-service #####################
# Requests to http://localhost:8080/api/products/** are forwarded to product-service
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082/
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**

################ inventory-service #####################
# Requests to http://localhost:8080/api/inventory/** are forwarded to inventory-service
spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083/
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/inventory/**
